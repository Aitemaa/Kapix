[package]
name = "kapix-app"
description = "Kapix entrypoint: Windows tray daemon + Win32 hosts, Linux Wayland overlay/pin hosts, CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kapix"
path = "src/main.rs"

[dependencies]
kapix-core.workspace = true
kapix-ui.workspace = true

[target.'cfg(windows)'.dependencies]
kapix-win.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
kapix-linux.workspace = true
rustix.workspace = true
wayrs-client.workspace = true
wayrs-protocols.workspace = true

[build-dependencies]
# Pure-Rust manifest embedding, used when cross-compiling from a non-Windows host.
embed-manifest.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Icon + manifest in a single resource script when building on Windows (build-time only).
winresource = "0.1"
