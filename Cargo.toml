[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/Aitemaa/Kapix"

[workspace.dependencies]
kapix-core = { path = "crates/kapix-core" }
kapix-ui = { path = "crates/kapix-ui" }
kapix-win = { path = "crates/kapix-win" }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
png = "0.18"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
windows = "0.62"
embed-manifest = "1.5"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
panic = "abort"

# Hot pixel paths: speed over size (≈ 4× faster overlay composition at 4K for a small size cost).
[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release.package.kapix-ui]
opt-level = 3
