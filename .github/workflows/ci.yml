name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # PRD §11 binary size gates for kapix.exe.
  SIZE_HARD_CAP: 4194304
  SIZE_WARN: 2621440

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (includes kapix-win WinRT/WIC/clipboard tests)
        run: cargo test --workspace

      - name: Pure-Rust dependency check (no cc / cmake / webview)
        shell: bash
        run: |
          tree=$(cargo tree --workspace -e normal,build --prefix none --format '{p}')
          bad=$(echo "$tree" | grep -E '^(cc|cmake|webview2|wry|tauri|ort|tesseract) ' || true)
          if [ -n "$bad" ]; then echo "::error::Forbidden dependencies: $bad"; exit 1; fi
          echo "OK: $(echo "$tree" | sort -u | wc -l) crates, all pure Rust"

      - name: Build release
        run: cargo build --release -p kapix-app

      - name: Binary size gate
        shell: bash
        run: |
          size=$(stat -c %s target/release/kapix.exe)
          echo "kapix.exe: $size bytes ($(awk "BEGIN{printf \"%.2f\", $size/1048576}") MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$SIZE_HARD_CAP" ]; then echo "::error::kapix.exe exceeds the 4 MiB hard cap"; exit 1; fi
          if [ "$size" -gt "$SIZE_WARN" ]; then echo "::warning::kapix.exe is above the 2.5 MiB target"; fi

      - name: Smoke test (CLI capture on the runner desktop)
        shell: pwsh
        run: |
          $exe = "target/release/kapix.exe"
          $v = Start-Process $exe -ArgumentList "--version" -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "--version exited $($v.ExitCode)" }
          $q = Start-Process $exe -ArgumentList "quit" -Wait -PassThru
          if ($q.ExitCode -ne 0) { throw "quit exited $($q.ExitCode)" }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $exe -ArgumentList "capture","--mode","fullscreen","--out","smoke.png" -Wait -PassThru
          $sw.Stop()
          if ($p.ExitCode -ne 0) { throw "capture exited $($p.ExitCode)" }
          $len = (Get-Item smoke.png).Length
          if ($len -le 0) { throw "smoke.png is empty" }
          "fullscreen CLI capture: $len bytes PNG, process wall time $($sw.ElapsedMilliseconds) ms" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $g = Start-Process $exe -ArgumentList "capture","--mode","fullscreen","--gdi","--out","smoke-gdi.png" -Wait -PassThru
          if ($g.ExitCode -ne 0) { throw "GDI capture exited $($g.ExitCode)" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $release = (Resolve-Path target/release).Path
          & $iscc /Q "/DAppVersion=$ver" "/DSourceDir=$release" "/DOutputDir=$release" packaging/windows/kapix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item target/release/kapix-*-windows-x64-setup.exe | ForEach-Object {
            "installer: $($_.Name) ($($_.Length) bytes)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kapix-windows-x64
          path: |
            target/release/kapix-*-windows-x64-setup.exe
            target/release/kapix.exe
            smoke*.png
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Pure-Rust dependency check (no cc / cmake / pkg-config / wayland-sys / webview)
        run: |
          tree=$(cargo tree --workspace -e normal,build --prefix none --format '{p}')
          bad=$(echo "$tree" | grep -E '^(cc|cmake|pkg-config|wayland-sys|webview2|wry|tauri|winit|wgpu|ort|tesseract) ' || true)
          if [ -n "$bad" ]; then echo "::error::Forbidden dependencies: $bad"; exit 1; fi
          echo "OK: $(echo "$tree" | sort -u | wc -l) crates, all pure Rust"

      - name: Build release
        run: cargo build --release -p kapix-app

      - name: Binary size & dynamic library gate
        run: |
          size=$(stat -c %s target/release/kapix)
          echo "kapix (linux): $size bytes ($(awk "BEGIN{printf \"%.2f\", $size/1048576}") MiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$SIZE_HARD_CAP" ]; then echo "::error::kapix exceeds the 4 MiB hard cap"; exit 1; fi
          if [ "$size" -gt "$SIZE_WARN" ]; then echo "::warning::kapix is above the 2.5 MiB target"; fi
          libs=$(ldd target/release/kapix)
          echo "$libs"
          if echo "$libs" | grep -Ei 'libwayland|libX11|libgtk|libQt|libfontconfig'; then
            echo "::error::Unexpected GUI shared library dependency"; exit 1
          fi

      - name: Smoke test CLI & install script syntax
        run: |
          ./target/release/kapix --version
          ./target/release/kapix --help > /dev/null
          bash -n packaging/linux/install.sh

      - name: Render UI snapshots
        run: cargo run --release -p kapix-ui --example snapshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kapix-linux-x64
          path: |
            target/release/kapix
            packaging/linux/kapix.desktop
            packaging/linux/install.sh
            packaging/niri/kapix.kdl
            snapshots-out/
          if-no-files-found: ignore
