name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build the Windows installer,
# portable zip, standalone x64 + ARM64 executables, and Linux tarball with SHA-256 checksums
# and attach them to a draft GitHub release.
# "Run workflow" builds them as artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the workspace version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build x64 and ARM64
        run: |
          cargo build --release -p kapix-app --locked --target x86_64-pc-windows-msvc
          cargo build --release -p kapix-app --locked --target aarch64-pc-windows-msvc

      - name: Package Windows release zip and portable executables
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $x64 = "target/x86_64-pc-windows-msvc/release/kapix.exe"
          $arm64 = "target/aarch64-pc-windows-msvc/release/kapix.exe"
          Copy-Item $x64 dist/kapix.exe
          Copy-Item $arm64 dist/kapix-arm64.exe

          $stage = "target/x86_64-pc-windows-msvc/release/kapix-$ver-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $x64 "$stage/kapix.exe"
          Copy-Item LICENSE "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/kapix-$ver-windows-x64.zip" -Force

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $source = (Resolve-Path target/x86_64-pc-windows-msvc/release).Path
          $out = (Resolve-Path dist).Path
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$source" "/DOutputDir=$out" packaging/windows/kapix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist/kapix-*-windows-x64-setup.exe | ForEach-Object { Write-Host ("{0}: {1:N0} bytes" -f $_.Name, $_.Length) }

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum kapix-*-windows-x64-setup.exe kapix.exe kapix-arm64.exe kapix-*-windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Attach to a draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/kapix-*-windows-x64-setup.exe
            dist/kapix.exe
            dist/kapix-arm64.exe
            dist/kapix-*-windows-x64.zip
            dist/SHA256SUMS.txt
          draft: true
          generate_release_notes: true

      - name: Keep as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: kapix-${{ steps.version.outputs.version }}-windows
          path: |
            dist/kapix-*-windows-x64-setup.exe
            dist/kapix.exe
            dist/kapix-arm64.exe
            dist/kapix-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the workspace version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Linux x64
        run: cargo build --release -p kapix-app --locked

      - name: Package Linux tarball and checksums
        run: |
          ver="${{ steps.version.outputs.version }}"
          stage="dist/kapix-${ver}-linux-x64"
          mkdir -p "$stage/packaging/linux" "$stage/packaging/niri" "$stage/assets"
          cp target/release/kapix "$stage/"
          cp packaging/linux/kapix.desktop packaging/linux/install.sh "$stage/packaging/linux/"
          cp packaging/niri/kapix.kdl "$stage/packaging/niri/"
          cp assets/icon.svg "$stage/assets/"
          cp LICENSE "$stage/"
          tar -C dist -czf "dist/kapix-${ver}-linux-x64.tar.gz" "kapix-${ver}-linux-x64"
          (cd dist && sha256sum "kapix-${ver}-linux-x64.tar.gz" > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)

      - name: Attach to a draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/kapix-*-linux-x64.tar.gz
            dist/SHA256SUMS-linux.txt
          draft: true
          generate_release_notes: true

      - name: Keep as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: kapix-${{ steps.version.outputs.version }}-linux-x64
          path: |
            dist/kapix-*-linux-x64.tar.gz
            dist/SHA256SUMS-linux.txt
